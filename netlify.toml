# ── netlify.toml (Skyrise Pro Marketing Website) ─────────────

# ── Tell Netlify where the serverless functions live (required for drag-and-drop) ──
[build]
  functions = "netlify/functions"

# ── HTML pages — no caching so updates deploy instantly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Root path "/" (what visitors actually load) — also no-cache.
# Without this, "/" is NOT matched by "/*.html" and the homepage gets cached stale.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Static assets — long cache with content-hash filenames
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers — all routes
[[headers]]
  for = "/*"
  # frame-src includes app.skyrisepro.ai (2026-10-08): the CLR dashboard opens Winston's
  # live Court Vision board in a frame; without it the browser refused the board outright.
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(self), geolocation=(), payment=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://js.stripe.com https://www.google.com https://www.gstatic.com https://api.elevenlabs.io https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' blob: data: https://api.elevenlabs.io; connect-src 'self' blob: https://api.stripe.com https://api.elevenlabs.io wss://api.elevenlabs.io wss://*.elevenlabs.io https://*.elevenlabs.io https://api.openai.com https://api.anthropic.com https://hook.us1.make.com https://hook.us2.make.com https://www.google-analytics.com https://cdn.jsdelivr.net https://esm.sh; frame-src https://js.stripe.com https://app.skyrisepro.ai; worker-src 'self' blob: https://esm.sh; object-src 'none'; base-uri 'self';"

# ── Netlify Function for secure webhook proxy
[[redirects]]
  from   = "/api/signup"
  to     = "/.netlify/functions/signup"
  status = 200

# ── Sky AI brain (secure Claude proxy)
[[redirects]]
  from   = "/api/sky"
  to     = "/.netlify/functions/sky-chat"
  status = 200

# ── Sky AI brain, STREAMING — now an EDGE function (netlify/edge-functions/
# sky-stream.js), which declares its own path via its config export. Standard
# Functions buffered the whole response (~22s flat) instead of streaming, so
# the Node version was retired. No redirect needed here.

# ── Voice transcription (secure Whisper proxy)
[[redirects]]
  from   = "/api/transcribe"
  to     = "/.netlify/functions/transcribe"
  status = 200

# (Removed 2026-10-01: /api/jarvis-brief. It returned the Attio pipeline and
# contact details to anyone, and nothing on this site uses it any more — admin
# Jarvis lives at app.skyrisepro.ai behind a Supabase admin login.)

[[redirects]]
  from   = "/api/tts"
  to     = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from   = "/api/weather"
  to     = "/.netlify/functions/weather"
  status = 200

# ── Form proxies to Make (2026-10-01). The browser posts here instead of to the
# public hook.us2.make.com URLs; these validate, rate-limit and forward with the
# Make API key. See netlify/functions/lib/make-forward.js.
[[redirects]]
  from   = "/api/booking-submit"
  to     = "/.netlify/functions/booking-submit"
  status = 200

[[redirects]]
  from   = "/api/lead-submit"
  to     = "/.netlify/functions/lead-submit"
  status = 200

# NOTE: No catch-all SPA rewrite — this is a multi-page static site.
# Netlify serves index.html, demo.html, court-vision-demo.html directly.
# A "/* -> /index.html" rule would shadow the function routes and break POSTs.
